<div id="toasts"></div>

<header class="hud-top">

  <div class="tops"><button class="pill lv" id="lv" type="button" title="我的檔案"></button><span class="pill" id="exam">學測</span><span class="pill" id="goal">今日 0 / 30</span><span class="pill feel" id="feel" hidden title="採集時連續答對，稀有生物更容易出現"></span></div>
</header>
<div class="hud-bl" id="tools"></div>
<div class="tourney" id="tourney" hidden></div>
<div class="hud-br">
  <button class="round-btn design-btn" id="designBtn" type="button" title="島嶼設計 (G)">🌷</button>
  <button class="round-btn decor-btn" id="decorBtn" type="button" title="裝潢 (F)">🛋</button>
  <button class="round-btn" id="pocketBtn" type="button" title="口袋 (I)">🎒</button>
  <button class="round-btn" id="phoneBtn" type="button" title="潮汐手機 (Tab)"><svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><rect x="12.5" y="5" width="23" height="38" rx="7" fill="#fffbe9" stroke="#25a58a" stroke-width="3.4"/><rect x="16.5" y="11" width="15" height="21" rx="3.2" fill="#8fe6cf"/><path d="M24 14.5c4.6 1.4 5.6 5.6 3.2 9.3-3.6-1-5.6-4.6-3.2-9.3z" fill="#fff"/><path d="M24.6 23.6l-2.4-5.2" stroke="#8fe6cf" stroke-width="1.2" stroke-linecap="round"/><circle cx="24" cy="37.4" r="2.4" fill="#25a58a"/></svg></button>
  <div class="bells"><i class="bell"></i><b id="bells">0</b><i class="gem" title="潮晶：答題、單字、專注與成就的獎勵"></i><b id="gems">0</b></div>
</div>
<button class="act-btn" id="actBtn" type="button">動作</button>
<button class="jump-btn" id="jumpBtn" type="button" aria-label="跳躍">跳</button>
<div class="joy" id="joy"><i id="joyKnob"></i></div>
<div class="place-bar" id="placeBar"><button type="button" id="pbRotate">↻ 旋轉</button><button type="button" id="pbCancel">✕ 結束</button></div>

<div class="dlg" id="dlg" hidden>
  <div class="dlg-bubble">
    <span class="dlg-name" id="dlgName"></span>
    <div class="dlg-timer" id="dlgTimer" hidden><i></i></div>
    <div class="dlg-text" id="dlgText"></div>
    <i class="dlg-next" id="dlgNext">▼</i>
  </div>
  <div class="choices" id="choices"></div>
</div>
<div class="passage" id="passage" hidden></div>
<div class="card" id="card" hidden></div>
<div class="panel" id="panel" hidden><div class="pn-box" id="panelBox"></div></div>

<div class="splash" id="splash">
  <div class="logo"><span>潮汐</span><b>小島</b></div>
  <p><span>和島民聊天、釣魚、捉蟲、挖化石——</span><span>每一件事都在複習學測</span></p>
  <small class="sp-info" id="spInfo"></small>
  <button type="button" id="start" class="loading" disabled>島嶼載入中…</button>
  <small class="sp-touch">左半邊按住拖曳移動（隱藏式搖桿：輕推慢走，再往外拖遠一點奔跑） · 右半邊拖曳轉視角（可以同時） · 點地面走過去、點島民聊天 · 「跳」最多三連跳 · 「動作」互動 · 兩指縮放</small>
  <small class="sp-keys">WASD 移動 · Shift 奔跑 · 空白鍵跳（空中可再跳兩次） · E 互動 · V 風景鏡頭 · 滾輪／右鍵拖曳調視角 · F 第一人稱 · 1–4 工具 · C 螃蟹走路 · Tab 手機 · I 口袋</small>
</div>
